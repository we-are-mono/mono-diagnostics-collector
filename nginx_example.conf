# nginx in front of mono-collector: nginx serves HTTPS, the collector runs on
# plain HTTP on the same machine.
#
#   /d       the routers' uploads; the X-Diag-Token header is the check
#   /        the dashboard, behind a login (HTTP basic auth)
#   /events  the dashboard's live-update stream, behind the same login
#
# Collector, on the same machine (the defaults: no -cert, local addresses):
#
#   mono-collector -token <token> -out /var/lib/mono-collector/diag.jsonl
#     uploads   on http://127.0.0.1:8080
#     dashboard on http://127.0.0.1:8081
#
# Login for the dashboard (one line per user; -c makes a new file):
#
#   htpasswd -c /etc/nginx/mono-diag.htpasswd <user>     # apache2-utils
#   or: printf '<user>:%s\n' "$(openssl passwd -apr1)" >> /etc/nginx/mono-diag.htpasswd
#
# Replace diag.example.com with the collector's public name, and use a
# certificate from a public CA (for example Let's Encrypt): the routers trust
# only their ca-bundle.

server {
    listen 80;
    listen [::]:80;
    server_name diag.example.com;

    # Let's Encrypt HTTP challenge; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diag.example.com;

    ssl_certificate     /etc/letsencrypt/live/diag.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diag.example.com/privkey.pem;

    # Uploads from the routers. No access log: the client note (CLIENT.md in
    # verso-plugin-diag) says that Mono does not store the IP address a reading
    # comes from. A failed request (for example while the collector is down)
    # can still name the client address in the error log.
    location = /d {
        access_log off;
        client_max_body_size 64k;   # the collector's own limit
        proxy_pass http://127.0.0.1:8080;
    }

    # The dashboard: it has no login of its own and shows every router's MAC
    # address, so nginx asks for one. It uses absolute paths ("/", "/events",
    # "/?device=..."), so it must stay at the root of this server name.
    location / {
        auth_basic "Mono diagnostics";
        auth_basic_user_file /etc/nginx/mono-diag.htpasswd;
        proxy_pass http://127.0.0.1:8081;
    }

    # Live update (Server-Sent Events): one long response that the collector
    # writes to as readings come in. nginx must pass each event on at once
    # (no buffering) and keep the connection open; the collector sends a
    # comment every 30 s, well inside the read timeout.
    location = /events {
        auth_basic "Mono diagnostics";
        auth_basic_user_file /etc/nginx/mono-diag.htpasswd;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
